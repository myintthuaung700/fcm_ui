<!DOCTYPE html>
<html>

<head>
  <title>FCM Test</title>
  <link rel="manifest" href="manifest.json">
  <!-- Include Alertify CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/alertifyjs@1.13.1/build/css/alertify.min.css" />
  <!-- Include Alertify theme (optional) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/alertifyjs@1.13.1/build/css/themes/default.min.css" />

  <!-- Include Alertify JavaScript -->
  <script src="https://cdn.jsdelivr.net/npm/alertifyjs@1.13.1/build/alertify.min.js"></script>
  <script type="module">
    // Import the functions you need from the SDKs you need
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import { getMessaging, getToken, onMessage } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-messaging.js";

    // Your web app's Firebase configuration
    const firebaseConfig = {
       // here is the config 
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);

    // Initialize Firebase Messaging
    const messaging = getMessaging(app);

    // Request permission to receive notifications
    Notification.requestPermission().then((permission) => {
      if (permission === 'granted') {
        console.log('Notification permission granted.');
        // Get the registration token
        getToken(messaging, { vapidKey: 'BMYu2HlpzAKG54gGyt8iXaTbmUqghjEbLROdN4RqX0ydaf8zE2COWwOhxzkgXsRJmIPHx-APDCeRtWtgTbpKcWI' }).then((currentToken) => {
          if (currentToken) {
            console.log('FCM Token:', currentToken);
            // Send the token to your backend for registration
          } else {
            console.log('No registration token available. Request permission to generate one.');
          }
        }).catch((err) => {
          console.error('An error occurred while retrieving token. ', err);
        });
      } else {
        console.log('Unable to get permission to notify.');
      }
    });

    // Handle incoming messages
    onMessage(messaging, (payload) => {
      console.log('Message received. ', payload);
      // Display notification or handle the message as needed
      const title = payload.data.title;
      const options = {
        body: payload.data.body,
        // icon: payload.data.icon,
        // image: payload.data.image,
        // data: {
        //     time: new Date(Date.now()).toString(),
        //     click_action: '/'
        // }
      };
      showNotification("tst", { body: "test" });
    });

    // Display a notification on the webpage
    function showNotification(title, options) {
      if (Notification.permission === 'granted') {
        alertify.notify('This is a basic notification!', 'success', 5, function () { console.log('dismissed'); });
      } else {
        console.log('Notification permission not granted.');
      }
    }
    function copyToClipboard(text) {
      navigator.clipboard.writeText(text).then(() => {
        alert('Copied to clipboard: ' + text);
      }).catch(err => {
        console.error('Failed to copy text: ', err);
      });
    }
  </script>
</head>

<body>
  <button onclick="copyToClipboard('12345ABCDE')">Get The App</button>
  <script>
    function copyToClipboard(text) {
      navigator.clipboard.writeText(text).then(() => {
		const userAgent = navigator.userAgent || navigator.vendor || window.opera;
		const playStoreLink = "https://play.google.com/store/apps/details?id=com.nirvasoft.grx003";
		const appStoreLink = "https://apps.apple.com/us/app/fleet-grx/id6737797228";

		if (/iPad|iPhone|iPod/.test(userAgent) || (/Macintosh/i.test(userAgent) && 'ontouchend' in document)) {
		  // Redirect to App Store
		  window.location.href = appStoreLink;
		} else {
		  // Redirect to Play Store
		  window.location.href = playStoreLink;
		}
      }).catch(err => {
        console.error('Failed to copy text: ', err);
      });
    }
  </script>
</body>

</html>
